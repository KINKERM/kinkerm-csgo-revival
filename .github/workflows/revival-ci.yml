name: Revival matchmaking CI

on:
  push:
    branches:
      - operation-revival-finish
  workflow_dispatch:

jobs:
  python-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check revival Python
        shell: pwsh
        run: python -m py_compile server/matchmaking.py server/revival_server.py launcher/launcher.py deploy/windows-gameserver/agent.py

  csgo-gc-win32:
    # Pin VS2022 because the csgo_gc Win32 CMake generator targets VS17.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Clone clean upstream csgo_gc
        shell: pwsh
        run: git clone --depth 1 https://github.com/mikkokko/csgo_gc.git upstream
      - name: Apply complete revival overlay
        shell: pwsh
        run: Copy-Item -Path 'csgo_gc-patch\*' -Destination 'upstream\csgo_gc\' -Force
      - name: Install Win32 dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install mbedtls:x86-windows protobuf:x86-windows
      - name: Configure Win32 Release
        shell: pwsh
        run: |
          cmake -S upstream -B upstream/build -G 'Visual Studio 17 2022' -A Win32 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build client server and GC
        shell: pwsh
        run: cmake --build upstream/build --config Release --target csgo srcds csgo_gc
