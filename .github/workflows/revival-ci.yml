name: Revival matchmaking CI

on:
  push:
    branches:
      - operation-revival-finish
  workflow_dispatch:

concurrency:
  group: revival-matchmaking-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check revival Python
        shell: pwsh
        run: python -m py_compile server/matchmaking.py server/revival_server.py launcher/launcher.py deploy/windows-gameserver/agent.py tools/pbin.py tools/patch_steam_hook.py launcher/build_pack.py
      - name: Test drop-in matchmaking flow
        shell: pwsh
        run: |
          Push-Location server
          python -m unittest test_matchmaking.py
          Pop-Location
      - name: Validate Panorama JS and XML
        shell: pwsh
        run: |
          node --check panorama/scripts/mainmenu_play.js
          node --check panorama/scripts/operation/operation_mission_card.js
          node --check panorama/scripts/operation/operation_util.js
          node --check panorama/scripts/popups/popup_activate_mission.js
          python -c "import xml.etree.ElementTree as ET; ET.parse(r'panorama/layout/mainmenu_play.xml'); print('Panorama XML OK')"
      - name: Validate Windows updater syntax
        shell: pwsh
        run: |
          foreach ($script in @('UPDATE_EXISTING_WINDOWS.ps1','REPACK_PANORAMA.ps1','deploy/windows-gameserver/UPDATE_LAPTOP.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) { $errors | Format-List; exit 1 }
          }

  csgo-gc-win32:
    # Full Win32 build is expensive; run it only when manually requested.
    if: github.event_name == 'workflow_dispatch'
    # Pin VS2022 because the csgo_gc Win32 CMake generator targets VS17.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone compatible upstream csgo_gc
        shell: pwsh
        run: |
          git clone https://github.com/mikkokko/csgo_gc.git upstream
          git -C upstream checkout 06301e7173329723a3506f8345fe23b147bc0881
      - name: Apply complete revival overlay
        shell: pwsh
        run: |
          Copy-Item -Path 'csgo_gc-patch\*' -Destination 'upstream\csgo_gc\' -Force
          python tools/patch_steam_hook.py upstream/csgo_gc/steam_hook.cpp
      - name: Install Win32 dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install mbedtls:x86-windows-static protobuf:x86-windows-static
      - name: Configure Win32 Release
        shell: pwsh
        run: |
          cmake -S upstream -B upstream/build -G 'Visual Studio 17 2022' -A Win32 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static
      - name: Build client server and GC
        shell: pwsh
        run: cmake --build upstream/build --config Release --target csgo srcds csgo_gc
      - name: Build full revival pack
        shell: pwsh
        run: python launcher/build_pack.py --csgo-gc-dir upstream --out csgo-revival-pack.zip
      - name: Validate pack contents
        shell: pwsh
        run: |
          python -c "import zipfile; z=zipfile.ZipFile('csgo-revival-pack.zip'); n=set(z.namelist()); req={'csgo_gc/csgo_gc.dll','csgo_revival.exe','srcds.exe','csgo_gc/config.txt','csgo/scripts/items/items_game.txt','csgo/panorama/pbin.py','csgo/panorama/layout/mainmenu_play.xml','csgo/panorama/scripts/mainmenu_play.js','csgo/panorama/styles/mainmenu_play.css'}; missing=sorted(req-n); print('missing:', missing); assert not missing"
      - uses: actions/upload-artifact@v4
        with:
          name: csgo-revival-pack-${{ github.sha }}
          path: csgo-revival-pack.zip
          if-no-files-found: error
