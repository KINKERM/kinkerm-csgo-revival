// CS:GO Revival dedicated server config (goes in csgo/cfg/server.cfg)
hostname "Kinkerm's CS:GO Revival"
sv_lan 0                        // 0 = internet server (csgo_gc handles GC auth)
sv_password ""                  // set a string to make it private (friends only)
rcon_password "CHANGE_ME_RCON"  // remote admin password - CHANGE THIS

sv_cheats 0
sv_pure 0
mp_autoteambalance 1
mp_limitteams 2

// competitive-friendly defaults (overridden per mode by the start scripts)
mp_maxrounds 30
mp_overtime_enable 1
mp_match_can_clinch 1
mp_warmuptime 20
mp_freezetime 15
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_friendlyfire 1
ff_damage_reduction_bullets 0.33
ff_damage_reduction_grenade 0.85
ff_damage_reduction_grenade_self 1
ff_damage_reduction_other 0.4

// CS matchmaking-style team-damage punishment.
mp_autokick 1
mp_tkpunish 0
mp_spawnprotectiontime 5
mp_td_dmgtowarn 200
mp_td_dmgtokick 300
mp_td_spawndmgthreshold 50
cash_player_killed_teammate -300

sv_allow_votes 1
sv_deadtalk 1
mp_death_drop_gun 1

// with csgo_gc there is no real Valve GC, so a GSLT is not required.
// leave sv_setsteamaccount empty.
sv_setsteamaccount ""


// one-slot revival matchmaking host
sv_hibernate_when_empty 0
sv_hibernate_postgame_delay 5
bot_quota 0
mp_endmatch_votenextmap 0
mp_match_end_restart 0
log on
