# CS:GO Revival launcher configuration
# Copy this to launcher.cfg next to the csgo-launcher executable and edit.

# URL of your revival server (the machine running revival_server.py)
server_url=http://127.0.0.1:8787

# The player's SteamID64 (17-digit number). Find yours at steamid.io or
# steamdb.info. This determines whose inventory gets synced.
steam_id=76561198000000000

# CS:GO Legacy install root - the folder that contains the game executable
# and the "csgo" and "csgo_gc" folders.
# Windows example:
#   csgo_dir=C:\Program Files (x86)\Steam\steamapps\common\Counter-Strike Global Offensive
# Linux example:
#   csgo_dir=/home/you/.steam/steam/steamapps/common/Counter-Strike Global Offensive
csgo_dir=/path/to/Counter-Strike Global Offensive

# Optional: override the game executable name.
# Defaults: csgo.exe (Windows), csgo_linux64 (Linux), csgo_osx64 (macOS)
# game_exe=csgo.exe

# Optional: launch arguments. -steam avoids the VAC message box with csgo_gc.
# game_args=-steam -game csgo -novid -dev

# Set to 0 to only sync the inventory without launching the game (useful for testing).
launch_game=1

# Persistence (optional but recommended). Paste the "sync token" the server
# prints on startup. When set, the launcher waits for you to close the game and
# then uploads your inventory back to the server, so opened cases, new skins and
# equipped loadouts are saved for next time. Leave blank to disable persistence.
sync_token=
